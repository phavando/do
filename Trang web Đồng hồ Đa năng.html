<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng Hồ Đa Năng - Modern Clock Suite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom Smooth Transitions for Analog Clock Hands */
        .hand {
            transform-origin: bottom center;
            transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }
        /* Glassmorphism background effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-cyan-500 selection:text-white">

    <!-- Header Navbar -->
    <header class="w-full max-w-5xl mx-auto px-4 py-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30">
                <i class="fa-solid me-0.5 fa-clock text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-cyan-600 to-blue-600 dark:from-cyan-400 dark:to-blue-400 bg-clip-text text-transparent">
                    Chronos Web
                </h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Đồng hồ đa năng hiện đại</p>
            </div>
        </div>

        <!-- Mode Toggle Button -->
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-3 rounded-2xl glass-card text-slate-700 dark:text-slate-200 hover:scale-105 active:scale-95 transition-all shadow-sm">
            <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>
    </header>

    <!-- Main Workspace Container -->
    <main class="w-full max-w-4xl mx-auto px-4 py-2 flex-grow flex flex-col justify-center items-center">
        
        <!-- Navigation Tabs -->
        <div class="flex p-1.5 space-x-1 glass-card rounded-2xl mb-8 shadow-sm max-w-md w-full">
            <button onclick="switchTab('clock')" id="tab-clock" class="tab-btn flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-white dark:bg-slate-800 shadow-sm text-cyan-600 dark:text-cyan-400">
                <i class="fa-regular fa-clock"></i> Đồng hồ
            </button>
            <button onclick="switchTab('stopwatch')" id="tab-stopwatch" class="tab-btn flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-stopwatch"></i> Bấm giờ
            </button>
            <button onclick="switchTab('timer')" id="tab-timer" class="tab-btn flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-hourglass-half"></i> Đếm ngược
            </button>
        </div>

        <!-- TAB 1: CLOCK DISPLAY -->
        <section id="view-clock" class="w-full flex flex-col items-center gap-8 transition-all duration-300">
            <!-- Analog Clock -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 glass-card rounded-full flex items-center justify-center shadow-xl p-4 border border-slate-200/50 dark:border-slate-800/80">
                <!-- Clock Face Markings -->
                <div class="absolute inset-0 rounded-full flex items-center justify-center">
                    <!-- Hours Marks -->
                    <span class="absolute top-3 text-slate-400 font-bold text-sm">12</span>
                    <span class="absolute right-4 text-slate-400 font-bold text-sm">3</span>
                    <span class="absolute bottom-3 text-slate-400 font-bold text-sm">6</span>
                    <span class="absolute left-4 text-slate-400 font-bold text-sm">9</span>
                    
                    <!-- Inner ticks -->
                    <div class="w-full h-full relative p-2">
                        <!-- Clock Center Pin -->
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-cyan-500 rounded-full z-30 shadow-md border-2 border-white dark:border-slate-900"></div>
                        
                        <!-- Hands -->
                        <div id="hourHand" class="hand absolute bottom-1/2 left-1/2 -translate-x-1/2 w-1.5 h-16 sm:h-20 bg-slate-800 dark:bg-slate-100 rounded-full z-10 shadow-sm"></div>
                        <div id="minuteHand" class="hand absolute bottom-1/2 left-1/2 -translate-x-1/2 w-1 h-22 sm:h-28 bg-slate-600 dark:bg-slate-300 rounded-full z-10 shadow-sm"></div>
                        <div id="secondHand" class="hand absolute bottom-1/2 left-1/2 -translate-x-1/2 w-0.5 h-24 sm:h-30 bg-cyan-500 rounded-full z-20"></div>
                    </div>
                </div>
            </div>

            <!-- Digital Clock & Date Info -->
            <div class="text-center space-y-2">
                <div id="digitalTime" class="mono-font text-5xl sm:text-7xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                    00:00:00
                </div>
                <div id="dateDisplay" class="text-base sm:text-lg font-medium text-cyan-600 dark:text-cyan-400 capitalize tracking-wide">
                    Đang tải ngày tháng...
                </div>
            </div>
        </section>

        <!-- TAB 2: STOPWATCH -->
        <section id="view-stopwatch" class="w-full hidden max-w-md flex-col items-center gap-6 transition-all duration-300">
            <div class="glass-card w-full rounded-3xl p-8 text-center shadow-xl">
                <div id="stopwatchDisplay" class="mono-font text-5xl sm:text-6xl font-bold tracking-tight text-slate-900 dark:text-white my-4">
                    00:00.00
                </div>

                <div class="flex justify-center gap-4 mt-6">
                    <button id="swStartBtn" onclick="toggleStopwatch()" class="w-16 h-16 rounded-2xl bg-cyan-500 hover:bg-cyan-600 text-white font-semibold text-xl shadow-lg shadow-cyan-500/30 active:scale-95 transition-all flex items-center justify-center">
                        <i class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    <button id="swLapBtn" onclick="recordLap()" disabled class="w-16 h-16 rounded-2xl bg-slate-200 dark:bg-slate-800 text-slate-400 dark:text-slate-600 font-semibold text-xl active:scale-95 transition-all flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-flag"></i>
                    </button>
                    <button id="swResetBtn" onclick="resetStopwatch()" class="w-16 h-16 rounded-2xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xl active:scale-95 transition-all flex items-center justify-center">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
            </div>

            <!-- Lap List -->
            <div class="w-full glass-card rounded-2xl p-4 max-h-48 overflow-y-auto">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-2">Vòng thời gian (Laps)</h3>
                <ul id="lapsContainer" class="space-y-2 text-sm">
                    <li class="text-center text-slate-400 py-2 text-xs italic">Chưa có dữ liệu vòng</li>
                </ul>
            </div>
        </section>

        <!-- TAB 3: COUNTDOWN TIMER -->
        <section id="view-timer" class="w-full hidden max-w-md flex-col items-center gap-6 transition-all duration-300">
            <div class="glass-card w-full rounded-3xl p-8 text-center shadow-xl">
                <!-- Inputs for setting timer (visible when stopped) -->
                <div id="timerInputGroup" class="flex justify-center items-center gap-2 my-4">
                    <div class="flex flex-col items-center">
                        <input type="number" id="timerHours" min="0" max="23" value="0" class="w-20 h-16 text-center mono-font text-3xl font-bold bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                        <span class="text-xs text-slate-400 mt-1">Giờ</span>
                    </div>
                    <span class="text-2xl font-bold text-slate-400 -mt-5">:</span>
                    <div class="flex flex-col items-center">
                        <input type="number" id="timerMinutes" min="0" max="59" value="05" class="w-20 h-16 text-center mono-font text-3xl font-bold bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                        <span class="text-xs text-slate-400 mt-1">Phút</span>
                    </div>
                    <span class="text-2xl font-bold text-slate-400 -mt-5">:</span>
                    <div class="flex flex-col items-center">
                        <input type="number" id="timerSeconds" min="0" max="59" value="00" class="w-20 h-16 text-center mono-font text-3xl font-bold bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                        <span class="text-xs text-slate-400 mt-1">Giây</span>
                    </div>
                </div>

                <!-- Display (Visible during countdown) -->
                <div id="timerDisplay" class="hidden mono-font text-5xl sm:text-6xl font-bold tracking-tight text-slate-900 dark:text-white my-4">
                    00:05:00
                </div>

                <!-- Controls -->
                <div class="flex justify-center gap-4 mt-6">
                    <button id="tmStartBtn" onclick="toggleTimer()" class="w-16 h-16 rounded-2xl bg-cyan-500 hover:bg-cyan-600 text-white font-semibold text-xl shadow-lg shadow-cyan-500/30 active:scale-95 transition-all flex items-center justify-center">
                        <i class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    <button id="tmResetBtn" onclick="resetTimer()" class="w-16 h-16 rounded-2xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xl active:scale-95 transition-all flex items-center justify-center">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-400 dark:text-slate-500">
        &copy; 2026 Chronos Web App. Được thiết kế đẹp mắt &amp; hiện đại.
    </footer>

    <script>
        // --- 1. THEME SWITCHER LOGIC ---
        function initTheme() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-lg text-amber-500';
            } else {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon text-lg';
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.className = 'fa-solid fa-sun text-lg text-amber-500';
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                icon.className = 'fa-solid fa-moon text-lg';
            }
        }

        // --- 2. NAVIGATION TAB SWITCHER ---
        function switchTab(tabName) {
            const tabs = ['clock', 'stopwatch', 'timer'];
            tabs.forEach(tab => {
                const view = document.getElementById(`view-${tab}`);
                const btn = document.getElementById(`tab-${tab}`);
                
                if (tab === tabName) {
                    view.classList.remove('hidden');
                    view.classList.add('flex');
                    btn.className = "tab-btn flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-white dark:bg-slate-800 shadow-sm text-cyan-600 dark:text-cyan-400";
                } else {
                    view.classList.add('hidden');
                    view.classList.remove('flex');
                    btn.className = "tab-btn flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-all flex items-center justify-center gap-2";
                }
            });
        }

        // --- 3. REAL-TIME CLOCK LOGIC ---
        function updateClock() {
            const now = new Date();

            // Digital Clock
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digitalTime').textContent = `${hours}:${minutes}:${seconds}`;

            // Date Display
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('vi-VN', options);

            // Analog Clock Hands Rotation
            const secDeg = (now.getSeconds() / 60) * 360;
            const minDeg = ((now.getMinutes() + now.getSeconds() / 60) / 60) * 360;
            const hourDeg = (((now.getHours() % 12) + now.getMinutes() / 60) / 12) * 360;

            document.getElementById('secondHand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
        }

        // --- 4. STOPWATCH LOGIC ---
        let swInterval = null;
        let swStartTime = 0;
        let swElapsedTime = 0;
        let swRunning = false;
        let lapCount = 0;

        function formatStopwatchTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const centiseconds = Math.floor((ms % 1000) / 10);

            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
        }

        function toggleStopwatch() {
            const startBtn = document.getElementById('swStartBtn');
            const lapBtn = document.getElementById('swLapBtn');

            if (!swRunning) {
                // Start
                swStartTime = Date.now() - swElapsedTime;
                swInterval = setInterval(() => {
                    swElapsedTime = Date.now() - swStartTime;
                    document.getElementById('stopwatchDisplay').textContent = formatStopwatchTime(swElapsedTime);
                }, 10);
                swRunning = true;
                
                startBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                startBtn.classList.replace('bg-cyan-500', 'bg-amber-500');
                startBtn.classList.replace('shadow-cyan-500/30', 'shadow-amber-500/30');

                lapBtn.disabled = false;
                lapBtn.classList.replace('text-slate-400', 'text-slate-700');
                lapBtn.classList.replace('dark:text-slate-600', 'dark:text-slate-200');
            } else {
                // Pause
                clearInterval(swInterval);
                swRunning = false;

                startBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
                startBtn.classList.replace('bg-amber-500', 'bg-cyan-500');
                startBtn.classList.replace('shadow-amber-500/30', 'shadow-cyan-500/30');

                lapBtn.disabled = true;
                lapBtn.classList.replace('text-slate-700', 'text-slate-400');
                lapBtn.classList.replace('dark:text-slate-200', 'dark:text-slate-600');
            }
        }

        function resetStopwatch() {
            clearInterval(swInterval);
            swRunning = false;
            swElapsedTime = 0;
            lapCount = 0;

            document.getElementById('stopwatchDisplay').textContent = '00:00.00';
            
            const startBtn = document.getElementById('swStartBtn');
            startBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
            startBtn.classList.replace('bg-amber-500', 'bg-cyan-500');

            const lapBtn = document.getElementById('swLapBtn');
            lapBtn.disabled = true;
            lapBtn.classList.replace('text-slate-700', 'text-slate-400');

            document.getElementById('lapsContainer').innerHTML = '<li class="text-center text-slate-400 py-2 text-xs italic">Chưa có dữ liệu vòng</li>';
        }

        function recordLap() {
            if (!swRunning) return;
            lapCount++;

            const lapsContainer = document.getElementById('lapsContainer');
            if (lapCount === 1) {
                lapsContainer.innerHTML = ''; // Clear placeholder
            }

            const lapItem = document.createElement('li');
            lapItem.className = 'flex justify-between items-center py-2 px-3 bg-slate-200/50 dark:bg-slate-800/50 rounded-xl font-mono';
            lapItem.innerHTML = `
                <span class="text-slate-500 text-xs">Vòng ${lapCount}</span>
                <span class="font-bold text-slate-800 dark:text-slate-200">${formatStopwatchTime(swElapsedTime)}</span>
            `;
            lapsContainer.prepend(lapItem);
        }

        // --- 5. TIMER LOGIC ---
        let timerInterval = null;
        let timerRemaining = 0;
        let timerRunning = false;

        function formatTimerTime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function toggleTimer() {
            const startBtn = document.getElementById('tmStartBtn');
            const inputGroup = document.getElementById('timerInputGroup');
            const display = document.getElementById('timerDisplay');

            if (!timerRunning) {
                if (timerRemaining === 0) {
                    const h = parseInt(document.getElementById('timerHours').value) || 0;
                    const m = parseInt(document.getElementById('timerMinutes').value) || 0;
                    const s = parseInt(document.getElementById('timerSeconds').value) || 0;
                    timerRemaining = (h * 3600) + (m * 60) + s;
                }

                if (timerRemaining <= 0) return;

                inputGroup.classList.add('hidden');
                display.classList.remove('hidden');
                display.textContent = formatTimerTime(timerRemaining);

                timerInterval = setInterval(() => {
                    timerRemaining--;
                    display.textContent = formatTimerTime(timerRemaining);

                    if (timerRemaining <= 0) {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        alert('⏰ Đã hết giờ đếm ngược!');
                        resetTimer();
                    }
                }, 1000);

                timerRunning = true;
                startBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                startBtn.classList.replace('bg-cyan-500', 'bg-amber-500');
            } else {
                clearInterval(timerInterval);
                timerRunning = false;
                startBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
                startBtn.classList.replace('bg-amber-500', 'bg-cyan-500');
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            timerRemaining = 0;

            document.getElementById('timerInputGroup').classList.remove('hidden');
            document.getElementById('timerDisplay').classList.add('hidden');

            const startBtn = document.getElementById('tmStartBtn');
            startBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
            startBtn.classList.replace('bg-amber-500', 'bg-cyan-500');
        }

        // --- 6. INITIALIZATION ON LOAD ---
        window.onload = function() {
            initTheme();
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>
</body>
</html>
